# ~/.streamlit/config.toml or .streamlit/config.toml

[server]
headless = true
port = 8501
sslCertFile = "./certificates/certificate.crt"
sslKeyFile = "./certificates/private.key"

[theme]
primaryColor = "#1a73e8"               # Example: blue (can customize)
backgroundColor = "#ffffff"            # White background
secondaryBackgroundColor = "#f8f9fa"   # Light gray secondary background
textColor = "#111111"                  # Dark text
font = "sans serif"                    # Clean, standard font
baseRadius = "large"
buttonRadius = "large"

[ui]
# Hide Streamlit branding and menu elements
hideMenuBar = true
hideFooter = true

